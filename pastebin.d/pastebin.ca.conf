[pastebin]
basename = pastebin.ca
https = True
post_page = api/v1/pastes
post_format = json
content_type = application/json
auth_token_env = PBCA_API_KEY
pow_page = api/v1/pastes/pow-challenge
paste_regexp = "url"\s*:\s*"https://pastebin\.ca/([^"\\]+)"
sizelimit = 1048576

[format]
content = body
title = title
format = syntax_hint
expiry = expires_in
private = visibility
access = access

[defaults]
expiry = 7d
private = unlisted
access = public
